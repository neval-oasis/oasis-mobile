function more(){const guide=role==='guide';return shell(header('Diğer','OASIS MENÜ')+`<div class="app-scroll"><div class="card row-card"><div class="logo-mark" style="width:49px;height:49px;border-radius:16px">${ic('sparkles')}</div><div class="row-body"><strong>${guide?'Şirket ve Rehber':'Turist'} Hesabı</strong><p>OASIS • ${guide?'Tur yönetimi':'Tur asistanı'} (demo)</p></div></div><div class="tile-list">${guide?`${action('Tur yönetimi','clipboard','tour','Kodlar, katılımcılar ve tur durumu')}${action('Anonim mesajlar','shield','inbox','Turistlerden gelen bildirimler')}${action('Yardım talepleri','alert','guide-alerts','Turist uyarıları')}${action('Abonelik planları','gift','plans','Haftalık, aylık ve yıllık')}`:`${action('Anonim mesaj gönder','shield','anon-compose','Kimliğin görünmeden geri bildirim')}${action('Acil durum desteği','alert','emergency','Rehberinize ulaşın')}${action('Tur bilgilerim','calendar','tour-info','Kod ve tur detayları')}`}</div><div style="height:15px"></div><button class="btn secondary" onclick="logout()">${ic('logout','small')} Çıkış Yap</button><p class="quiet">Tasarım prototipi • Gerçek hesap, ödeme, konum ve AI servisi bağlanmamıştır.</p></div>`)}
function plans(){return shell(header('Abonelik Paketleri','ŞİRKET / REHBER')+`<div class="app-scroll"><div class="card" style="background:linear-gradient(120deg,#f7e4d8,#e1f8f0)"><span class="pill tinted">${ic('sparkles','small')} OASIS Premium</span><h2 style="font:normal 30px Georgia,serif;color:#0b6f72;margin:14px 0 8px">Turunuza uygun planı seçin</h2><p class="smallcopy">Rehberler ve şirketler için haftalık, aylık ve yıllık erişim seçenekleri.</p></div><div class="plan-tabs">${['Haftalık','Aylık','Yıllık'].map(n=>`<button onclick="choosePlan('${n}')" class="${db.plan===n?'active':''}">${n}</button>`).join('')}</div><div class="plan-grid">${[['Haftalık','$9.99','7 gün'],['Aylık','$19.99','30 gün'],['Yıllık','$99.99','365 gün']].map(([n,p,sub])=>`<button class="plan-card ${db.plan===n?'selected':''}" onclick="choosePlan('${n}')"><strong>${n}</strong><div class="price">${p}</div><small>${sub}${db.plan===n?' ✓':''}</small></button>`).join('')}</div><button class="btn" onclick="openModal('subscribe')">${ic('check','small')} Planı İncele</button><div class="section-top"><h2>Plan özellikleri</h2></div>${action('Tüm yönetim araçları','users','guide-home','Tur paneli ve turist erişimi')}${action('OASIS AI araçları','sparkles','guide-home','Ürün tanıtım özellikleri')}<p class="soft-note">Fiyatlar konsept ekranlarından alınmış örnek tutarlardır. Bu prototip üzerinden gerçek ödeme alınmaz.</p></div>`)}
function main(){let html='';if(screen==='welcome')html=welcome();else if(screen==='login')html=login();else if(!role)html=welcome();else if(role==='tourist'){html=({ 'tourist-home':touristHome,'map':touristMap,'chat':chatPage,'ai':aiPage,'anon-compose':anonymousCompose,'emergency':emergency,'tour-info':tourInfo,'more':more})[screen]?.()||touristHome();}else{html=({'guide-home':guideHome,'tour':tourManage,'chat':chatPage,'inbox':guideInbox,'guide-map':guideMap,'guide-alerts':guideAlerts,'plans':plans,'more':more})[screen]?.()||guideHome();}
 root.innerHTML=html+(modal?renderModal():'');if(screen==='chat'){const t=document.getElementById('chat-messages');if(t)t.scrollTop=t.scrollHeight}if(screen==='ai'){const t=document.getElementById('aiMessages');if(t)t.scrollTop=t.scrollHeight}}
function go(p){if(!role&&!['welcome','login'].includes(p)){p='welcome'}if(role==='guide'&&['tourist-home','map','ai','anon-compose','emergency','tour-info'].includes(p))p='guide-home';if(role==='tourist'&&['guide-home','tour','inbox','guide-map','guide-alerts','plans'].includes(p))p='tourist-home';screen=p;modal=null;main();window.scrollTo(0,0)}
function startLogin(r){loginRole=r;loginError='';go('login')}
function verify(){const val=(document.getElementById('accessCode')?.value||'').trim().toUpperCase();if(loginRole==='guide'&&val==='REHBER2026'){role='guide';go('guide-home');note('Rehber paneline hoş geldiniz!');return}if(loginRole==='tourist'&&db.codes.some(c=>c.toUpperCase()===val)){role='tourist';go('tourist-home');note('Turist erişimi açıldı!');return}loginError='Kod geçersiz. Demo kodunu kullanabilirsiniz.';const e=document.getElementById('loginError');if(e)e.textContent=loginError}
function logout(){role=null;loginRole=null;go('welcome')}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>note('Kod kopyalandı: '+t)).catch(()=>openModal('copy',t));else openModal('copy',t)}
function generateCode(){let c='TUR-'+Math.floor(100000+Math.random()*900000);db.codes.unshift(c);save();main();note('Yeni katılım kodu oluşturuldu.')}
function toggleTour(){db.tourActive=!db.tourActive;save();main();note(db.tourActive?'Tur aktifleştirildi.':'Tur duraklatıldı.')}
function updateTourName(){let val=document.getElementById('tourName')?.value.trim();if(!val)return note('Tur adı boş olamaz.');db.tourName=val;save();main();note('Tur adı kaydedildi.')}
function sendChat(){const v=document.getElementById('chatText')?.value.trim();if(!v)return;const now=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});db.chat.push({by:role,text:v,time:now});save();main();note('Mesaj demo sohbetine eklendi.')}
function sendAnonymous(){const txt=document.getElementById('anonText')?.value.trim(),type=document.getElementById('anonType')?.value;if(!txt)return note('Lütfen mesajınızı yazın.');const id='A-'+Math.floor(10000+Math.random()*90000);const obj={id,text:txt,type,sender:db.memberId,time:new Date().toLocaleString('tr-TR',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})};db.anonymous.unshift(obj);db.myAnon.unshift(obj);save();main();note('Anonim mesaj rehberin demo gelen kutusuna eklendi.')}
function sendSOS(){const obj={text:'Turist: Kayboldum, yardım istiyorum. Rehberimle iletişim kurulmasını talep ediyorum.',time:new Date().toLocaleString('tr-TR')};db.alerts.unshift(obj);db.chat.push({by:'tourist',text:'Yardım talebi: Kayboldum, rehberimle görüşmek istiyorum.',time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})});save();note('Demo yardım talebi kaydedildi. Gerçek bildirim gönderilmedi.')}
function aiResponse(q){let a='OASIS burada. Bu örnek prototipte gerçek AI bağlantısı bulunmuyor. Rehberinizle sohbet etmek için Sohbet ekranını kullanabilirsiniz.';if(/kaybol|yol|konum|nerde|nerede|rota|müze/i.test(q))a='Öncelikle güvenli bir yerde durun. Bulunduğunuz yeri tarif edin, harita ekranına bakın ve rehberinize mesaj gönderin. Gerçek konumunuz bu demo tarafından bilinmiyor.';else if(/endiş|panik|kork|kaygı|sakin/i.test(q))a='Sizi duyuyorum. Güvenli bir noktada kalın, çevrenize bakın ve mümkünse rehberinize ulaşın. Birlikte sıradaki adımı belirleyebiliriz.';else if(/acil|imdat|yaralan|hasta|ambulans/i.test(q))a='Acil bir durumdaysanız Türkiye’de doğrudan 112’yi arayın. Bu demo acil servis veya rehbere otomatik ihbar göndermez.';else if(/internetsiz|çevrimdışı|offline|gps/i.test(q))a='Telefonun GPS konumunuzu internet olmadan belirleyebilmesi mümkündür; fakat konumu başka bir telefona aktarmak için ayrıca iletişim altyapısı gerekir. Bu prototip çevrimdışı paylaşım yapmıyor.';return a}
function askPreset(v){const el=document.getElementById('aiText');if(el)el.value=v;sendAI()}
function sendAI(){const txt=document.getElementById('aiText')?.value.trim();if(!txt)return;db.aiMessages.push({by:'tourist',text:txt},{by:'ai',text:aiResponse(txt)});save();main()}
function callGuide(){openModal('call')}
function choosePlan(n){db.plan=n;save();main()}
function requestReveal(id){openModal('reveal',id)}
function openModal(type,val=''){modal={type,val};main()}
function closeModal(){modal=null;main()}
function revealIdentity(){const v=(document.getElementById('approvalCode')?.value||'').trim().toUpperCase();if(v!=='YETKI2026')return note('Demo onay kodu: YETKI2026');const item=db.anonymous.find(a=>a.id===modal.val);if(!item)return note('Mesaj bulunamadı.');db.audit.push({id:item.id,time:new Date().toISOString(),role});save();openModal('identity',item.id)}
function renderModal(){let inner='';if(modal.type==='call')inner=`<h2>Rehberle Arama</h2><p>Bu ekran arama özelliğinin bir tasarım ön izlemesidir. Gerçek telefon veya internet araması başlatılmaz.</p><button class="btn" onclick="closeModal();go('chat')">${ic('chat','small')} Mesaj Gönder</button>`;
if(modal.type==='subscribe')inner=`<h2>${esc(db.plan)} Plan</h2><p>Abonelik ekranı etkileşimli bir tanıtımdır. Gerçek ödeme alınmaz, banka hesabı veya kart bilgisi istenmez.</p><button class="btn" onclick="closeModal()">Anladım</button>`;
if(modal.type==='copy')inner=`<h2>Katılım Kodunu Kopyala</h2><p>Aşağıdaki kodu seçerek kopyalayabilirsiniz.</p><input class="text-field" value="${esc(modal.val)}" readonly onclick="this.select()">`;
if(modal.type==='reveal')inner=`<div class="pill tinted">${ic('shield','small')} Yetkili inceleme</div><h2>Şirket Onayı Gerekli</h2><p>Anonimliği yalnızca uygun ve gerekli durumlarda, yetkili şirketin onayıyla inceleyin. Bu prototip hukuki yetkilendirme yerine geçmez.</p><label class="field-label" for="approvalCode">Örnek şirket onay kodu</label><input class="text-field" id="approvalCode" placeholder="Onay kodunu girin" autocomplete="off"><button class="btn" onclick="revealIdentity()">${ic('eye','small')} Kimlik Bilgisini Gör (Demo)</button><div class="soft-note">Sunum kodu: <b>YETKI2026</b>. İşlem, yerel demo denetim kaydına eklenir.</div>`;
if(modal.type==='identity'){const item=db.anonymous.find(a=>a.id===modal.val);inner=`<div class="pill tinted">${ic('check','small')} Demo onayı kabul edildi</div><h2>Örnek Katılımcı Bilgisi</h2><div class="code-display">${esc(item?.sender||'Kimlik yok')}</div><p>Bu, gerçek bir kişi kimliği değil; yalnızca bu demo için oluşturulmuş katılımcı numarasıdır. Görüntüleme kaydı tutuldu.</p><button class="btn" onclick="closeModal()">Kapat</button>`}
return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="OASIS Penceresi"><div class="modal-top"><div class="logo-word" style="font-size:18px">OASIS</div><button class="icon-button" aria-label="Kapat" onclick="closeModal()">✕</button></div>${inner}</div></div>`}
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal)closeModal()});
main();
</script></body></html>
